[project]
name = "django-sqlite-protobuf"
version = "0.1.0"
description = "Django integration for the sqlite_protobuf SQLite extension"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_sqlite_protobuf"]
# Include pre-compiled native libraries placed by the build:* tasks.
# The libs/ tree looks like:
#   django_sqlite_protobuf/libs/x86_64-unknown-linux-gnu/libsqlite_protobuf.so
#   django_sqlite_protobuf/libs/x86_64-unknown-linux-musl/libsqlite_protobuf.so
artifacts = ["django_sqlite_protobuf/libs/**"]
