syntax = "proto3";

package test;

import "google/protobuf/timestamp.proto";

enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_ACTIVE = 1;
    STATUS_INACTIVE = 2;
}

message Address {
    string street = 1;
    string city = 2;
    int32 zip_code = 3;
    string country = 4;
}

message Person {
    string name = 1;
    int32 age = 2;
    double score = 3;
    bool active = 4;
    bytes avatar = 5;
    Address address = 6;
    repeated string tags = 7;
    map<string, int32> metadata = 8;
    Status status = 9;
    int64 created_at = 10;
    optional string nickname = 11;
    repeated Address previous_addresses = 12;
    uint64 large_id = 13;
    float temperature = 14;
    google.protobuf.Timestamp created_ts = 15;
}

// Used to test oneof behaviour: two branches that each carry a `label` and a
// branch-specific field.  COALESCE(extract(.., 'branch_a.label'),
// extract(.., 'branch_b.label')) should return the label of whichever branch
// is actually set, because extract now returns NULL for the inactive branch.
message BranchA {
    string label = 1;
    int32 value = 2;
    Person person = 3;
}

message BranchB {
    string label = 1;
    string category = 2;
    int32 count = 3;
    double score = 4;
    bool enabled = 5;
}

message Record {
    oneof source {
        BranchA branch_a = 1;
        BranchB branch_b = 2;
    }
}
